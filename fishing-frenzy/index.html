<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#092f43">
<title>Fishing Frenzy</title>
<style>
:root{--ink:#f4fbff;--gold:#ffd477;--panel:rgba(5,35,52,.82);--line:rgba(211,241,255,.18)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#082d43;color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,sans-serif;touch-action:manipulation}button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
#game{height:100dvh;width:100%;position:relative;overflow:hidden;background:linear-gradient(#8bd8e4 0%,#4aa9bd 35%,#12617a 68%,#07384f 100%)}
.sky{position:absolute;inset:0 0 48% 0;background:linear-gradient(180deg,#a5e5e8,#6bc5d1 70%,#4aabbc)}
.sun{position:absolute;width:100px;height:100px;border-radius:50%;background:#fff1bb;filter:blur(1px);right:12%;top:8%;box-shadow:0 0 55px 24px #ffe7a766}
.cloud{position:absolute;width:160px;height:35px;border-radius:50%;background:#e6f7e9aa;filter:blur(8px);top:16%;left:8%}
.waterline{position:absolute;top:39%;height:7%;left:-5%;width:110%;border-radius:50%;background:#b5f1e3aa;filter:blur(10px)}
.ocean{position:absolute;inset:42% 0 0;background:linear-gradient(180deg,#24869a 0%,#0d536e 43%,#062d46 100%)}
.ray{position:absolute;top:38%;height:63%;width:22%;background:linear-gradient(180deg,#d7fff044,transparent);clip-path:polygon(35% 0,70% 0,100% 100%,0 100%);transform:rotate(10deg);transform-origin:top;opacity:.7}
.ray.r2{left:36%;width:17%;transform:rotate(-12deg);opacity:.45}.ray.r3{left:75%;width:15%;transform:rotate(15deg);opacity:.4}
.ripple{position:absolute;top:42%;left:50%;width:130px;height:22px;border:2px solid #d8fff477;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 15px #d8fff455}
.bubble{position:absolute;border:1px solid #d4faff99;border-radius:50%;animation:rise 7s linear infinite;opacity:.65}.b1{width:9px;height:9px;left:15%;top:85%}.b2{width:5px;height:5px;left:70%;top:76%;animation-delay:2s}.b3{width:13px;height:13px;left:88%;top:92%;animation-delay:4s}
@keyframes rise{to{transform:translateY(-65vh);opacity:0}}
.fish{position:absolute;width:95px;filter:drop-shadow(0 7px 5px #052b3d66);animation:swim 11s ease-in-out infinite alternate}.fish svg{width:100%;overflow:visible}.f1{left:7%;top:57%;animation-duration:12s}.f2{right:8%;top:70%;width:66px;animation-delay:-4s;animation-duration:14s}.f3{left:54%;top:83%;width:48px;animation-delay:-7s;opacity:.8}
@keyframes swim{0%{transform:translateX(-12px) scaleX(1)}48%{transform:translateX(65px) scaleX(1)}51%{transform:translateX(65px) scaleX(-1)}100%{transform:translateX(-12px) scaleX(-1)}}
.seabed{position:absolute;bottom:-2%;height:19%;width:100%;background:linear-gradient(180deg,#d5b783,#967b58 45%,#66523f);clip-path:polygon(0 45%,12% 31%,25% 40%,38% 23%,52% 42%,68% 28%,83% 40%,100% 23%,100% 100%,0 100%)}
.coral{position:absolute;bottom:9%;width:52px;height:75px;filter:drop-shadow(0 5px 3px #062e3d77)}.coral svg{width:100%;height:100%}.c1{left:6%}.c2{right:9%;transform:scale(.8);bottom:10%}.weed{position:absolute;bottom:8%;width:5px;height:72px;border-radius:100% 0;background:#3c9876;transform:rotate(-16deg);left:30%;box-shadow:13px -12px 0 -1px #4ba17c,26px 2px 0 -1px #337f68}
header{position:absolute;top:env(safe-area-inset-top,8px);left:0;right:0;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;z-index:5;pointer-events:none}header>*{pointer-events:auto}
.brand{font-weight:1000;letter-spacing:.04em;font-size:clamp(17px,4vw,24px);text-shadow:0 2px 6px #063b4c88}.brand span{color:#ffe08d}
.stats{display:flex;gap:7px}.pill{background:#07394dcc;border:1px solid #d7f6ff44;border-radius:18px;padding:7px 11px;font-size:13px;font-weight:850;box-shadow:0 5px 14px #06324733}
.hud{position:absolute;top:calc(env(safe-area-inset-top,8px) + 58px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:4}.location{background:#07394dbb;border:1px solid #d7f6ff44;border-radius:14px;padding:8px 12px;font-size:12px;font-weight:800;letter-spacing:.04em}.weather{font-size:12px;color:#e5ffff;text-shadow:0 1px 5px #07394d}
.boat{position:absolute;top:29%;left:50%;transform:translateX(-50%);width:min(370px,88vw);height:135px;z-index:3;pointer-events:none}.boat svg{width:100%;height:100%;overflow:visible}.line{position:absolute;left:50%;top:37%;height:18%;border-left:2px solid #f9e3b5;z-index:2;opacity:.8}
.cast-zone{position:absolute;z-index:6;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);width:min(410px,92vw);display:flex;flex-direction:column;align-items:center;gap:10px}
.message{background:#07384cdb;border:1px solid #c8f1ff55;border-radius:18px;padding:10px 16px;text-align:center;font-weight:800;font-size:13px;box-shadow:0 7px 22px #062b3b55;min-width:220px}
.mainbtn{width:100%;border-radius:20px;padding:16px 20px;background:linear-gradient(180deg,#ffe49a,#f3ad4e);color:#553b1d;font-weight:1000;font-size:18px;letter-spacing:.03em;box-shadow:0 6px 0 #b87936,0 13px 25px #042d3e66;text-shadow:0 1px #fff7;transition:transform .12s}.mainbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #b87936,0 6px 12px #042d3e66}.mainbtn:disabled{filter:grayscale(.55);opacity:.65}
.subrow{display:flex;gap:8px;width:100%}.subbtn{flex:1;background:#07394dd9;border:1px solid #d7f6ff44;border-radius:14px;padding:10px;font-weight:800;font-size:13px}
.overlay{position:absolute;inset:0;z-index:10;background:#031c2bd9;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.sheet{width:min(470px,100%);max-height:86%;overflow:auto;background:linear-gradient(155deg,#14546b,#082d45);border:1px solid #c8efff44;border-radius:24px;padding:20px;box-shadow:0 22px 70px #00162299}.sheet h2{margin:0 0 6px;font-size:23px}.muted{color:#b9dce6;font-size:13px;line-height:1.45}.close{float:right;background:#ffffff18;border-radius:12px;padding:7px 11px}.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff1a}.fishicon{width:58px;height:48px;border-radius:13px;background:linear-gradient(145deg,#73c8ce,#14546b);display:grid;place-items:center;font-size:28px}.iteminfo{flex:1}.iteminfo b{display:block}.iteminfo small{color:#b8dbe5}.buy{background:#f7c56c;color:#503718;padding:9px 12px;border-radius:12px;font-weight:900}.catchcard{text-align:center;padding:12px}.catchart{font-size:76px;filter:drop-shadow(0 10px 15px #001a2c88);margin:10px}.rarity{color:#ffdc8c;font-weight:950;letter-spacing:.15em;font-size:12px}.catchname{font-size:27px;font-weight:1000}.catchsize{color:#c8e9f0;margin:6px}.reward{font-size:18px;color:#ffdf91;font-weight:900;margin:10px}
@media(orientation:landscape) and (max-height:520px){.boat{top:22%;height:110px}.hud{top:58px}.cast-zone{bottom:10px;width:min(380px,55vw);gap:6px}.message{padding:7px 12px}.mainbtn{padding:12px}.subbtn{padding:7px}.seabed{height:16%}}
</style>
</head>
<body><div id="game">
<div class="sky"><div class="sun"></div><div class="cloud"></div></div><div class="ocean"></div><div class="ray"></div><div class="ray r2"></div><div class="ray r3"></div><div class="waterline"></div><div class="ripple"></div>
<div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
<div class="fish f1"><svg viewBox="0 0 120 70"><defs><linearGradient id="fishgold" x2="0" y2="1"><stop stop-color="#ffe69a"/><stop offset="1" stop-color="#dc873f"/></linearGradient></defs><path d="M23 35Q48 3 88 25Q103 35 88 48Q48 67 23 35Z" fill="url(#fishgold)" stroke="#8d5b37" stroke-width="2"/><path d="M24 35L2 13Q7 35 2 57Z" fill="#e89a52" stroke="#8d5b37" stroke-width="2"/><path d="M51 17Q65 3 74 18M51 53Q66 65 77 51" fill="#f9c76f" stroke="#b87642" stroke-width="2"/><circle cx="79" cy="30" r="4" fill="#fff"/><circle cx="80" cy="30" r="2" fill="#142d37"/></svg></div>
<div class="fish f2"><svg viewBox="0 0 120 70"><path d="M23 35Q48 3 88 25Q103 35 88 48Q48 67 23 35Z" fill="#73d5c8" stroke="#216f78" stroke-width="2"/><path d="M24 35L2 13Q7 35 2 57Z" fill="#48a9a4"/><path d="M49 18L62 4L75 19M48 53L65 64L78 51" fill="#8be2d0"/><circle cx="79" cy="30" r="4" fill="#fff"/><circle cx="80" cy="30" r="2" fill="#142d37"/></svg></div>
<div class="fish f3"><svg viewBox="0 0 120 70"><path d="M23 35Q48 3 88 25Q103 35 88 48Q48 67 23 35Z" fill="#8a9fdf" stroke="#4a5d9c" stroke-width="2"/><path d="M24 35L2 13Q7 35 2 57Z" fill="#6e81bd"/><circle cx="79" cy="30" r="4" fill="#fff"/><circle cx="80" cy="30" r="2" fill="#142d37"/></svg></div>
<div class="boat"><svg viewBox="0 0 380 145"><defs><linearGradient id="hull" x2="0" y2="1"><stop stop-color="#b86e3d"/><stop offset="1" stop-color="#643a2c"/></linearGradient><linearGradient id="deck" x2="0" y2="1"><stop stop-color="#f4d19a"/><stop offset="1" stop-color="#b98755"/></linearGradient></defs><path d="M40 71Q190 91 340 71L306 112Q190 137 74 112Z" fill="url(#hull)" stroke="#553528" stroke-width="4"/><path d="M70 67Q190 79 310 67L290 91Q190 105 90 91Z" fill="url(#deck)" stroke="#8b5739" stroke-width="3"/><path d="M135 67V36Q135 24 148 24H228Q241 24 241 36V69Z" fill="#f0d2a0" stroke="#845d43" stroke-width="4"/><path d="M150 37H224V56H150Z" fill="#78bdc6" stroke="#845d43" stroke-width="3"/><path d="M190 24V3" stroke="#614b3b" stroke-width="5"/><path d="M190 5L190 23L220 17Z" fill="#fff1c8"/><path d="M45 68Q190 84 335 68" fill="none" stroke="#ffe0a6" stroke-width="5"/></svg></div><div class="line"></div>
<div class="seabed"></div><div class="coral c1"><svg viewBox="0 0 60 90"><path d="M30 88Q24 65 29 48Q10 40 12 18Q25 32 31 42Q29 20 42 4Q49 28 35 49Q51 39 58 29Q58 53 35 61L38 90Z" fill="#e87966" stroke="#ad554e" stroke-width="2"/></svg></div><div class="coral c2"><svg viewBox="0 0 60 90"><path d="M30 88Q24 65 29 48Q10 40 12 18Q25 32 31 42Q29 20 42 4Q49 28 35 49Q51 39 58 29Q58 53 35 61L38 90Z" fill="#d6a75e" stroke="#a87b43" stroke-width="2"/></svg></div><div class="weed"></div>
<header><div class="brand">FISHING <span>FRENZY</span></div><div class="stats"><div class="pill">🪙 <span id="coins">80</span></div><div class="pill">🎣 Lv.<span id="level">1</span></div></div></header>
<div class="hud"><div class="location" id="location">☀️ SUNLIT COVE</div><div class="weather">● CLEAR SKIES</div></div>
<div class="cast-zone"><div class="message" id="message">The water is full of surprises. Cast your line!</div><button class="mainbtn" id="cast">🎣 CAST LINE</button><div class="subrow"><button class="subbtn" id="collection">🐟 FISH BOOK</button><button class="subbtn" id="shop">⚙️ GEAR SHOP</button><button class="subbtn" id="places">🗺️ WATERS</button></div></div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
</div>
<script>
(()=>{const $=id=>document.getElementById(id);let save;try{save=JSON.parse(localStorage.getItem('fishing-frenzy-save')||'{}')}catch(e){save={}}
const state={coins:save.coins??80,level:save.level??1,rod:save.rod??0,luck:save.luck??0,place:save.place??0,catches:save.catches??{},xp:save.xp??0,casts:0,mode:'idle',timer:null,fish:null};
const fish=[
{name:'Sunscale Perch',emoji:'🐠',rarity:'COMMON',value:12,xp:8,weight:40,places:[0,1,2]},
{name:'Bluefin Snapper',emoji:'🐟',rarity:'COMMON',value:15,xp:9,weight:34,places:[0,1]},
{name:'Moon Jelly',emoji:'🪼',rarity:'UNCOMMON',value:28,xp:15,weight:17,places:[0,1,2]},
{name:'Coral Grouper',emoji:'🐡',rarity:'UNCOMMON',value:34,xp:18,weight:16,places:[0,1]},
{name:'Golden Koi',emoji:'🎏',rarity:'RARE',value:85,xp:38,weight:8,places:[1,2]},
{name:'Lionfish',emoji:'🦁',rarity:'RARE',value:105,xp:45,weight:7,places:[0,1]},
{name:'Ancient Coelacanth',emoji:'🦈',rarity:'EPIC',value:260,xp:90,weight:3,places:[2]},
{name:'Pearlback Ray',emoji:'🐬',rarity:'EPIC',value:320,xp:110,weight:2,places:[1,2]},
{name:'Abyssal Crown',emoji:'🐉',rarity:'LEGENDARY',value:1000,xp:300,weight:0.5,places:[2]}
];
const places=[{name:'SUNLIT COVE',icon:'☀️',cost:0,desc:'Warm shallows and friendly fish.'},{name:'CORAL KINGDOM',icon:'🪸',cost:180,desc:'Bright reefs hiding unusual catches.'},{name:'MIDNIGHT TRENCH',icon:'🌌',cost:600,desc:'Dark deep water. Rare fish roam here.'}];
function persist(){localStorage.setItem('fishing-frenzy-save',JSON.stringify({coins:state.coins,level:state.level,rod:state.rod,luck:state.luck,place:state.place,catches:state.catches,xp:state.xp}))}
function update(){ $('coins').textContent=state.coins;$('level').textContent=state.level;$('location').textContent=places[state.place].icon+' '+places[state.place].name;persist()}
function message(t){$('message').textContent=t}
function close(){ $('overlay').classList.remove('show')}
function panel(html){$('sheet').innerHTML=html;$('overlay').classList.add('show')}
function pickFish(){let pool=fish.filter(f=>f.places.includes(state.place));let luck=1+state.luck*.22;let total=pool.reduce((s,f)=>s+f.weight*(f.rarity==='LEGENDARY'?luck:1),0),r=Math.random()*total;for(const f of pool){r-=f.weight*(f.rarity==='LEGENDARY'?luck:1);if(r<=0)return f}return pool[0]}
function cast(){if(state.mode!=='idle')return;state.mode='waiting';state.casts++;$('cast').disabled=true;$('cast').textContent='⏳ WAIT FOR A BITE';message('Your line is drifting through the water…');let wait=1800+Math.random()*3600-state.rod*180;state.timer=setTimeout(()=>{state.fish=pickFish();state.mode='bite';$('cast').disabled=false;$('cast').textContent='⚡ REEL IT IN!';message('A FISH IS BITING! Tap REEL now!');$('game').animate([{filter:'brightness(1)'},{filter:'brightness(1.17)'},{filter:'brightness(1)'}],500)},Math.max(900,wait))}
function reel(){if(state.mode==='waiting'){clearTimeout(state.timer);state.mode='idle';$('cast').disabled=false;$('cast').textContent='🎣 CAST LINE';message('You reeled in too early! Wait for a bite.');return}if(state.mode==='bite'){const f=state.fish;state.mode='idle';const size=(20+Math.random()*80+state.rod*5).toFixed(0);const bonus=Math.round(f.value*(.85+Math.random()*.3));state.coins+=bonus;state.xp+=f.xp;state.catches[f.name]=(state.catches[f.name]||0)+1;while(state.xp>=state.level*70){state.xp-=state.level*70;state.level++;state.coins+=35}update();$('cast').textContent='🎣 CAST AGAIN';message('Nice catch! '+f.name+' landed!');panel('<button class="close" id="x">✕</button><div class="catchcard"><div class="rarity">'+f.rarity+' CATCH</div><div class="catchart">'+f.emoji+'</div><div class="catchname">'+f.name+'</div><div class="catchsize">'+size+' cm · '+f.xp+' XP</div><div class="reward">+🪙 '+bonus+'</div><p class="muted">Added to your Fish Book. Keep exploring to discover them all!</p><button class="mainbtn" id="keep">KEEP FISH</button></div>');$('x').onclick=close;$('keep').onclick=close;return}cast()}
function showCollection(){let html='<button class="close" id="x">✕</button><h2>🐟 Fish Book</h2><p class="muted">Your growing collection. Discover every species across the three waters.</p>';for(const f of fish){let n=state.catches[f.name]||0;html+='<div class="item"><div class="fishicon">'+(n?f.emoji:'❔')+'</div><div class="iteminfo"><b>'+(n?f.name:'Undiscovered')+'</b><small>'+f.rarity+' · '+(n?'Caught '+n+' time(s)':'Not found yet')+'</small></div><b>'+(n?'✓':'—')+'</b></div>'}panel(html);$('x').onclick=close}
function showShop(){let upgrades=[{name:'Fiberglass Rod',desc:'Quicker bites and better catches',cost:150,kind:'rod',max:3},{name:'Lucky Lure',desc:'Improves your chance of rare fish',cost:220,kind:'luck',max:3}];let html='<button class="close" id="x">✕</button><h2>⚙️ Gear Shop</h2><p class="muted">Upgrade your kit to reach bigger catches.</p>';for(let u of upgrades){let n=state[u.kind];html+='<div class="item"><div class="fishicon">'+(u.kind==='rod'?'🎣':'✨')+'</div><div class="iteminfo"><b>'+u.name+' · '+n+'/'+u.max+'</b><small>'+u.desc+'</small></div><button class="buy" data-kind="'+u.kind+'" data-cost="'+u.cost+'" data-max="'+u.max+'">'+(n>=u.max?'MAX':'🪙 '+u.cost)+'</button></div>'}panel(html);$('x').onclick=close;$('sheet').querySelectorAll('.buy').forEach(b=>b.onclick=()=>{let k=b.dataset.kind,c=+b.dataset.cost,m=+b.dataset.max;if(state[k]>=m)return;if(state.coins<c){b.textContent='NEED COINS';return}state.coins-=c;state[k]++;update();showShop()})}
function showPlaces(){let html='<button class="close" id="x">✕</button><h2>🗺️ Explore Waters</h2><p class="muted">Each location has its own fish and secrets.</p>';places.forEach((p,i)=>{let unlocked=i===0||state.place>=i||state.coins>=p.cost;html+='<div class="item"><div class="fishicon">'+p.icon+'</div><div class="iteminfo"><b>'+p.name+'</b><small>'+p.desc+'</small></div><button class="buy" data-place="'+i+'">'+(state.place===i?'HERE':i===0||state.place>=i?'GO':'🪙 '+p.cost)+'</button></div>'});panel(html);$('x').onclick=close;$('sheet').querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{let i=+b.dataset.place,p=places[i];if(i>0&&state.place<i){if(state.coins<p.cost){b.textContent='NEED COINS';return}state.coins-=p.cost}state.place=i;update();close();message('Welcome to '+p.name+'! Cast your line.')})}
$('cast').onclick=reel;$('collection').onclick=showCollection;$('shop').onclick=showShop;$('places').onclick=showPlaces;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});update();
})();
</script></body></html>
