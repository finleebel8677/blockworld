<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#102c42">
<title>Island Builder</title>
<style>
:root{color-scheme:dark;--ink:#f5f4e9;--muted:#b8d0d0;--glass:rgba(12,38,52,.82);--line:rgba(221,246,235,.18);--gold:#ffd36e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102c42;color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:manipulation;user-select:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:linear-gradient(#76c6d0 0%,#268ca7 55%,#14647f 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;pointer-events:none}
.top{top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;justify-content:space-between}
.brand,.resources,.panel,.buildbar{background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 24px #09273755;backdrop-filter:blur(12px)}
.brand{padding:9px 13px;border-radius:15px;font-weight:1000;letter-spacing:1.5px;font-size:clamp(13px,2.2vw,18px);text-shadow:0 2px 0 #16495a}
.brand span{color:var(--gold)}
.resources{display:flex;gap:clamp(7px,2vw,18px);padding:8px 13px;border-radius:15px;font-weight:850;font-size:clamp(11px,1.8vw,15px)}
.resource{white-space:nowrap}.resource b{color:var(--gold);font-variant-numeric:tabular-nums}
.side{position:absolute;z-index:3;right:12px;top:76px;display:flex;flex-direction:column;gap:8px}
.action{border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:13px;padding:10px 13px;font-weight:850;font-size:12px;box-shadow:0 6px 18px #09273755;backdrop-filter:blur(10px)}
.action:active,.build:active{transform:translateY(1px) scale(.98)}
.bottom{position:absolute;z-index:4;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(760px,calc(100% - 22px))}
.buildbar{display:flex;gap:7px;padding:8px;border-radius:18px;justify-content:center}
.build{flex:1;min-width:0;max-width:132px;border:1px solid #d9eee51c;border-radius:13px;background:linear-gradient(160deg,#315b62,#1a414e);color:#f7f3df;padding:8px 5px 7px;font-weight:850;font-size:clamp(10px,1.6vw,13px);display:flex;flex-direction:column;align-items:center;gap:3px}
.build .emoji{font-size:clamp(20px,3.6vw,30px);line-height:1.15}.build small{color:#c1d8d2;font-size:10px;font-weight:700}.build.selected{outline:2px solid var(--gold);background:linear-gradient(160deg,#6e6748,#355b55)}
#hint{position:absolute;z-index:3;left:50%;top:76px;transform:translateX(-50%);padding:8px 13px;border-radius:20px;background:#10384cbb;border:1px solid #d8f1df33;color:#f7f4df;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none;text-align:center}
#toast{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;border-radius:14px;background:#102f3eee;border:1px solid #e8f2d966;font-weight:900;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
#rotate{display:none;position:absolute;inset:0;z-index:20;background:#102c42;align-items:center;justify-content:center;text-align:center;padding:30px}
#rotate .inner{max-width:280px}.phone{font-size:48px;margin-bottom:10px}
#modal{display:none;position:absolute;inset:0;z-index:10;background:#061c29aa;align-items:center;justify-content:center;padding:20px}
.dialog{width:min(390px,100%);background:#153c4b;border:1px solid #d9eee544;border-radius:22px;padding:20px;box-shadow:0 20px 60px #061b2c99}
.dialog h2{margin:0 0 8px;font-size:22px}.dialog p{color:#c1d8d2;font-size:13px;line-height:1.5}
.dialog button{width:100%;padding:12px;border-radius:12px;background:#e8bd62;color:#233d42;font-weight:950;margin-top:8px}
@media(orientation:portrait){#rotate{display:flex}#app>*:not(#rotate){visibility:hidden}}
@media(max-height:430px) and (orientation:landscape){.top{top:6px}.brand{padding:6px 10px}.resources{padding:6px 9px}.side{top:56px;right:8px}.action{padding:7px 10px}.bottom{bottom:5px}.buildbar{padding:5px}.build{padding:5px 3px}.build .emoji{font-size:20px}#hint{top:55px}}
</style>
</head>
<body>
<div id="app">
<canvas id="world"></canvas>
<div class="hud top"><div class="brand">ISLAND <span>BUILDER</span></div><div class="resources"><div class="resource">🪙 <b id="coins">120</b></div><div class="resource">🪵 <b id="wood">35</b></div><div class="resource">⭐ <b id="level">1</b></div></div></div>
<div id="hint">Choose a building, then tap a glowing plot</div>
<div class="side"><button class="action" id="collect">📦 Collect</button><button class="action" id="expand">＋ Expand island</button><button class="action" id="menu">☰ Menu</button></div>
<div class="bottom"><div class="buildbar" id="buildbar">
<button class="build selected" data-type="hut"><span class="emoji">🏡</span>Hut<small>35 🪙 · 8 🪵</small></button>
<button class="build" data-type="farm"><span class="emoji">🌾</span>Farm<small>55 🪙 · 12 🪵</small></button>
<button class="build" data-type="lodge"><span class="emoji">🏘️</span>Lodge<small>90 🪙 · 18 🪵</small></button>
<button class="build" data-type="lighthouse"><span class="emoji">🗼</span>Beacon<small>120 🪙 · 25 🪵</small></button>
<button class="build" data-type="tree"><span class="emoji">🌳</span>Grove<small>20 🪙</small></button>
</div></div>
<div id="toast"></div>
<div id="modal"><div class="dialog"><h2 id="modalTitle">Island menu</h2><p id="modalText">Your island is growing.</p><button id="saveClose">Back to island</button><button id="reset">Start a new island</button></div></div>
<div id="rotate"><div class="inner"><div class="phone">📱 ↻</div><h2>Turn your device sideways</h2><p>Island Builder is designed for a wide, immersive view.</p></div></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const costs={hut:[35,8],farm:[55,12],lodge:[90,18],lighthouse:[120,25],tree:[20,0]};
const labels={hut:'Hut',farm:'Farm',lodge:'Lodge',lighthouse:'Beacon',tree:'Grove'};
let state={coins:120,wood:35,level:1,expanded:0,buildings:[],selected:'hut',lastCollect:Date.now()};
const saved=localStorage.getItem('island-builder-save');if(saved){try{state={...state,...JSON.parse(saved)}}catch(e){}}
let W=0,H=0,dpr=1,plots=[],island={x:0,y:0,rx:0,ry:0},toastTimer;
function save(){localStorage.setItem('island-builder-save',JSON.stringify(state));}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);layout();}
function layout(){island={x:W*.48,y:H*.53,rx:Math.min(W*.34,360),ry:Math.min(H*.34,190)};plots=[];let coords=[[-.62,-.25],[-.32,-.38],[0,-.4],[.32,-.34],[.62,-.2],[-.72,.08],[-.4,.02],[-.08,.04],[.25,.05],[.58,.1],[-.56,.34],[-.23,.35],[.12,.34],[.46,.34],[.76,.3],[-.05,-.08],[.35,-.12],[-.78,-.08]];
coords.forEach(([x,y],i)=>{if(i<10+state.expanded*3)plots.push({x:island.x+x*island.rx,y:island.y+y*island.ry,r:Math.min(26,W*.027)})});}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function ellipse(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function drawOcean(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#77cbd1');g.addColorStop(.55,'#238eaa');g.addColorStop(1,'#10566f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let i=0;i<34;i++){let x=((i*137+t*.012)% (W+180))-90,y=(i*83+Math.sin(t*.0005+i)*16)%H;ctx.strokeStyle='rgba(221,250,235,'+(0.07+(i%3)*.025)+')';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(x,y,15+(i%5)*5,2,0,0,Math.PI*2);ctx.stroke();}}
function drawIsland(){let {x,y,rx,ry}=island;
ctx.save();ctx.shadowColor='#08394a99';ctx.shadowBlur=30;ctx.shadowOffsetY=18;ellipse(x,y+12,rx*1.08,ry*1.08,'#b9824d');ctx.restore();
ellipse(x,y+4,rx*1.06,ry*1.05,'#d3a66b');ellipse(x,y,rx*1.02,ry*1.02,'#e9d69a');
let g=ctx.createLinearGradient(x,y-ry,x,y+ry);g.addColorStop(0,'#79b978');g.addColorStop(.6,'#4f9b68');g.addColorStop(1,'#327e60');ellipse(x,y-3,rx,ry,g);
ctx.save();ctx.beginPath();ctx.ellipse(x,y-3,rx,ry,0,0,Math.PI*2);ctx.clip();
for(let i=0;i<110;i++){let a=i*2.399,rr=Math.sqrt((i*37%109)/109),px=x+Math.cos(a)*rr*rx*.93,py=y-3+Math.sin(a)*rr*ry*.9;ellipse(px,py,2+(i%4),1.5+(i%3),'rgba(208,224,143,'+(0.12+(i%3)*.04)+')');}
ctx.restore();
ellipse(x-rx*.78,y-ry*.55,rx*.12,ry*.11,'#d8c58b');
}
function drawPalm(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle='#8a5a35';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-4,-22,4,-42);ctx.stroke();ctx.fillStyle='#287b52';for(let i=0;i<6;i++){ctx.save();ctx.rotate(i*Math.PI/3);ctx.beginPath();ctx.ellipse(9,-43,18,5,.25,0,Math.PI*2);ctx.fill();ctx.restore()}ellipse(0,1,8,3,'#d8bd78');ctx.restore();}
function drawBuilding(b){let p=plots[b.plot];if(!p)return;let x=p.x,y=p.y;
if(b.type==='tree'){drawPalm(x,y+8,1.0);return;}
ellipse(x,y+11,28,10,'rgba(16,61,48,.22)');
if(b.type==='hut'||b.type==='lodge'){let w=b.type==='hut'?37:49,h=b.type==='hut'?27:34;
ctx.fillStyle='#e9d9ad';ctx.fillRect(x-w/2,y-h,w,h);ctx.fillStyle='#a9573f';ctx.beginPath();ctx.moveTo(x-w/2-5,y-h);ctx.lineTo(x,y-h-22);ctx.lineTo(x+w/2+5,y-h);ctx.closePath();ctx.fill();ctx.fillStyle='#784c38';ctx.fillRect(x-6,y-16,12,16);ctx.fillStyle='#8fc7c1';ctx.fillRect(x-17,y-h+9,8,8);ctx.fillRect(x+9,y-h+9,8,8);
if(b.type==='lodge'){ctx.fillStyle='#d9c59a';ctx.fillRect(x-8,y-h-25,16,12);}}
if(b.type==='farm'){ctx.fillStyle='#b98a4c';ctx.fillRect(x-26,y-20,52,18);for(let i=0;i<5;i++){ctx.strokeStyle='#e6c16b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-21+i*10,y-18);ctx.lineTo(x-21+i*10,y-4);ctx.stroke();}for(let i=0;i<4;i++){ellipse(x-18+i*12,y-25-(i%2)*3,4,9,'#a4c76a');}}
if(b.type==='lighthouse'){ctx.fillStyle='#f2e8ca';ctx.fillRect(x-12,y-42,24,42);ctx.fillStyle='#d85f4d';ctx.fillRect(x-12,y-33,24,8);ctx.fillRect(x-12,y-17,24,8);ctx.fillStyle='#f7d97e';ctx.fillRect(x-10,y-52,20,10);ctx.fillStyle='#ffeeb0';ctx.fillRect(x-5,y-49,10,5);}
}
function draw(t){drawOcean(t);drawIsland();drawPalm(island.x-island.rx*.78,island.y-island.ry*.58,.85);drawPalm(island.x+island.rx*.76,island.y+island.ry*.45,.72);
plots.forEach((p,i)=>{let b=state.buildings.find(z=>z.plot===i);if(!b){ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle=state.selected?'rgba(255,238,169,.6)':'rgba(255,255,255,.2)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y+4,17,7,0,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.restore();} });
state.buildings.slice().sort((a,b)=>plots[a.plot].y-plots[b.plot].y).forEach(drawBuilding);
ctx.fillStyle='rgba(255,248,213,.8)';ctx.font='800 12px system-ui';ctx.textAlign='center';ctx.fillText('SUNSHORE ISLAND',island.x,island.y+island.ry*.76);
requestAnimationFrame(draw);}
function updateUI(){$('coins').textContent=Math.floor(state.coins);$('wood').textContent=Math.floor(state.wood);$('level').textContent=state.level;document.querySelectorAll('.build').forEach(b=>b.classList.toggle('selected',b.dataset.type===state.selected));}
function say(s){let el=$('toast');el.textContent=s;el.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.opacity=0,1500);}
function pickBuild(type){state.selected=type;updateUI();say('Tap an empty plot to place '+labels[type]);}
document.querySelectorAll('.build').forEach(b=>b.addEventListener('click',()=>pickBuild(b.dataset.type)));
function place(x,y){let best=-1,dist=1e9;plots.forEach((p,i)=>{let d=Math.hypot(x-p.x,y-p.y);if(d<dist){dist=d;best=i;}});if(best<0||dist>Math.max(30,plots[best].r*1.5))return;
if(state.buildings.some(b=>b.plot===best)){say('That plot is occupied');return;}
let [c,w]=costs[state.selected];if(state.coins<c||state.wood<w){say('Not enough resources');return;}
state.coins-=c;state.wood-=w;state.buildings.push({plot:best,type:state.selected});state.level=1+Math.floor(state.buildings.length/4);save();updateUI();say(labels[state.selected]+' built!');}
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;place(e.clientX,e.clientY);});
$('collect').onclick=()=>{let gain=0,wood=0;state.buildings.forEach(b=>{if(b.type==='hut')gain+=5;if(b.type==='farm'){gain+=3;wood+=2}if(b.type==='lodge')gain+=10;if(b.type==='lighthouse')gain+=14;if(b.type==='tree')wood+=3;});state.coins+=gain;state.wood+=wood;state.lastCollect=Date.now();save();updateUI();say('Collected +'+gain+' coins and +'+wood+' wood');};
$('expand').onclick=()=>{let cost=100+state.expanded*90;if(state.coins<cost){say('Need '+cost+' coins to expand');return;}if(state.expanded>=2){say('Your island is fully expanded!');return;}state.coins-=cost;state.expanded++;layout();save();updateUI();say('New shoreline unlocked!');};
$('menu').onclick=()=>{$('modalTitle').textContent='Island menu';$('modalText').textContent='Build a thriving island village. Buildings earn resources when you collect. Your progress is saved on this device.';$('modal').style.display='flex';};
$('saveClose').onclick=()=>{$('modal').style.display='none';};
$('reset').onclick=()=>{if(confirm('Start a new island? This erases this island save.')){state={coins:120,wood:35,level:1,expanded:0,buildings:[],selected:'hut',lastCollect:Date.now()};save();layout();updateUI();$('modal').style.display='none';say('A fresh island awaits!');}};
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,250));
resize();updateUI();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
