<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#101b2b">
<title>Deep Miner</title>
<style>
:root{--bg:#101b2b;--panel:#1b2b40;--panel2:#243951;--gold:#ffc85a;--mint:#67e0b1;--muted:#9db1c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f5f7fb;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button{font:inherit;color:inherit;border:0;touch-action:manipulation;cursor:pointer}
#app{height:100dvh;max-width:560px;margin:auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 5%,#263d55 0,#14243a 48%,#101b2b 100%);overflow:hidden}
header{padding:12px 16px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:1000;letter-spacing:1.5px;font-size:19px}.brand span{color:var(--gold)}.depth{text-align:right;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1px}.depth b{display:block;color:white;font-size:20px;letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 10px}.stat{background:#20334a;border:1px solid #344d66;border-radius:13px;padding:8px 10px;box-shadow:0 4px 12px #07111d55}.stat small{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.7px}.stat strong{display:block;font-size:16px;margin-top:1px}
#mineArea{position:relative;flex:1;min-height:0;margin:0 9px;border-radius:20px;overflow:hidden;border:2px solid #344b62;background:#17283b;box-shadow:inset 0 0 35px #07111caa}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#0c1825cc;border:1px solid #52677c;border-radius:20px;padding:7px 12px;font-size:11px;font-weight:800;color:#dce8f5;pointer-events:none}
#toast{position:absolute;left:50%;bottom:12px;transform:translate(-50%,12px);opacity:0;background:#0c1928ee;border:1px solid #71859a;border-radius:12px;padding:9px 14px;font-size:12px;font-weight:900;pointer-events:none;transition:.2s;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}
.bottom{padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.action{border-radius:15px;padding:10px 5px;background:linear-gradient(180deg,#2c4660,#20354b);border:1px solid #49627b;box-shadow:0 4px 0 #102032;font-weight:900;font-size:12px;min-height:53px}.action .emoji{font-size:19px;display:block;margin-bottom:1px}.action:active{transform:translateY(2px);box-shadow:0 2px 0 #102032}.action.primary{background:linear-gradient(180deg,#ffda79,#f2a93b);color:#422b08;border-color:#ffe29b}
#modal{position:fixed;inset:0;background:#07111dcc;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:5}#modal.open{display:flex}.sheet{width:min(100%,540px);max-height:82dvh;overflow:auto;background:linear-gradient(180deg,#263c54,#17283c);border:1px solid #526a82;border-radius:23px;padding:18px;box-shadow:0 20px 70px #0009}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet h2{margin:0;font-size:21px}.close{background:#40566c;border-radius:10px;width:35px;height:35px;font-size:20px}.upgrade{display:flex;align-items:center;gap:12px;background:#1a2c40;border:1px solid #3a536c;border-radius:15px;padding:12px;margin:9px 0}.upgrade .ico{font-size:27px}.upgrade .info{flex:1;min-width:0}.upgrade b{display:block}.upgrade small{color:var(--muted);font-size:11px}.buy{background:#eeb64e;color:#392608;border-radius:10px;padding:9px 11px;font-weight:1000;font-size:12px;min-width:78px}.buy:disabled{opacity:.38}.inventory{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ore{background:#1a2c40;border:1px solid #3a536c;border-radius:12px;padding:10px;font-size:12px}.ore b{float:right;color:#fff}
@media(min-width:600px){#app{height:100dvh;border-left:1px solid #31465d;border-right:1px solid #31465d}.bottom{padding-bottom:14px}}
</style></head>
<body><div id="app">
<header><div class="brand">⛏️ DEEP <span>MINER</span></div><div class="depth">CURRENT DEPTH<b id="depth">0 m</b></div></header>
<div class="stats"><div class="stat"><small>🪙 COINS</small><strong id="coins">0</strong></div><div class="stat"><small>⚡ PICKAXE POWER</small><strong id="power">1</strong></div><div class="stat"><small>🎒 ORE BAG</small><strong id="bag">0 / 30</strong></div></div>
<div id="mineArea"><canvas id="game"></canvas><div id="hint">TAP A BLOCK NEXT TO YOU TO MINE</div><div id="toast"></div></div>
<div class="bottom"><button class="action" id="upgradeBtn"><span class="emoji">🛠️</span>UPGRADES</button><button class="action primary" id="sellBtn"><span class="emoji">💰</span>SELL ORES</button><button class="action" id="bagBtn"><span class="emoji">🎒</span>COLLECTION</button></div>
</div>
<div id="modal"><div class="sheet"><div class="sheethead"><h2 id="modalTitle">Upgrades</h2><button class="close" id="close">×</button></div><div id="modalBody"></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),area=document.getElementById('mineArea');
const $=id=>document.getElementById(id);
const ores=[
{name:'Stone',emoji:'🪨',value:1,hp:1,color:'#82909c',min:0},
{name:'Copper',emoji:'🟠',value:4,hp:2,color:'#c77a4a',min:3},
{name:'Iron',emoji:'⚙️',value:8,hp:3,color:'#aebbc7',min:8},
{name:'Silver',emoji:'🥈',value:18,hp:4,color:'#c7d6e5',min:16},
{name:'Gold',emoji:'🟡',value:35,hp:5,color:'#ffd15b',min:25},
{name:'Ruby',emoji:'💎',value:75,hp:7,color:'#ff6688',min:40},
{name:'Sapphire',emoji:'🔷',value:130,hp:9,color:'#63b9ff',min:60},
{name:'Emerald',emoji:'💚',value:220,hp:12,color:'#5be0a2',min:85},
{name:'Amethyst',emoji:'🔮',value:400,hp:15,color:'#bd8aff',min:115}
];
const defaults={coins:0,power:1,bag:[],counts:{},depth:0,capacity:30,upgrades:{power:0,capacity:0},seen:[]};
let save;try{save={...defaults,...JSON.parse(localStorage.getItem('deepMinerSave')||'{}')};}catch(e){save={...defaults};}
let grid=[],cols=9,tile=42,camY=0,player={x:4,y:0},shake=0,particles=[],lastToast=0;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1));
function genRow(y){let row=[];for(let x=0;x<cols;x++){let depth=y*4;let pool=ores.filter(o=>o.min<=depth);let weights=pool.map((o,i)=>i===0?44:Math.max(2,24-i*3));let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total,idx=0;while(idx<weights.length-1&&(r-=weights[idx])>0)idx++;let o=pool[idx];if(y===0)o=ores[0];row.push({ore:o,hp:o.hp,seed:Math.random()*10});}return row;}
function ensureRows(){while(grid.length<Math.max(40,player.y+24))grid.push(genRow(grid.length));}
function persist(){try{localStorage.setItem('deepMinerSave',JSON.stringify(save));}catch(e){}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(lastToast);lastToast=setTimeout(()=>$('toast').classList.remove('show'),1450);}
function updateUI(){$('coins').textContent=Math.floor(save.coins).toLocaleString();$('power').textContent=save.power;$('bag').textContent=save.bag.length+' / '+save.capacity;$('depth').textContent=(player.y*4)+' m';}
function resize(){let r=area.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(r.width*d);canvas.height=Math.floor(r.height*d);ctx.setTransform(d,0,0,d,0,0);cols=9;tile=Math.max(30,Math.min(48,r.width/cols));}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function drawBlock(x,y,b,sx,sy){let o=b.ore;let depth=y*4;let grad=ctx.createLinearGradient(sx,sy,sx,sy+tile);grad.addColorStop(0,depth<10?'#43566a':'#34465a');grad.addColorStop(1,depth<10?'#293c50':'#202f42');ctx.fillStyle=grad;rounded(sx+1,sy+1,tile-2,tile-2,5);ctx.fill();ctx.strokeStyle='#6a829755';ctx.lineWidth=1;ctx.stroke();
let cracked=b.hp<o.hp;if(o!==ores[0]){ctx.fillStyle=o.color;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(sx+tile*.5,sy+tile*.49,tile*.19,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#ffffff66';ctx.beginPath();ctx.arc(sx+tile*.43,sy+tile*.4,tile*.055,0,Math.PI*2);ctx.fill();}
if(cracked){ctx.strokeStyle='#101a28';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx+tile*.48,sy+tile*.28);ctx.lineTo(sx+tile*.4,sy+tile*.52);ctx.lineTo(sx+tile*.56,sy+tile*.62);ctx.stroke();}
}
function draw(){let w=area.clientWidth,h=area.clientHeight;ctx.clearRect(0,0,w,h);let target=Math.max(0,player.y*tile-h*.52);camY+=(target-camY)*.13;let offset=(h%tile)/2;
let start=Math.max(0,Math.floor(camY/tile)),end=Math.min(grid.length-1,start+Math.ceil(h/tile)+2);
for(let y=start;y<=end;y++)for(let x=0;x<cols;x++){let sx=(w-cols*tile)/2+x*tile,sy=y*tile-camY;drawBlock(x,y,grid[y][x],sx,sy);}
let px=(w-cols*tile)/2+player.x*tile,py=player.y*tile-camY;
ctx.save();ctx.translate(px+tile/2,py+tile/2+Math.sin(Date.now()/180)*1.5);ctx.shadowColor='#ffd46a';ctx.shadowBlur=13;ctx.fillStyle='#ffd46a';rounded(-tile*.28,-tile*.35,tile*.56,tile*.7,8);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#60421d';rounded(-tile*.19,-tile*.22,tile*.38,tile*.28,5);ctx.fill();ctx.fillStyle='#f5d5a1';ctx.beginPath();ctx.arc(0,-tile*.34,tile*.16,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#e9f0f5';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(tile*.12,-tile*.1);ctx.lineTo(tile*.4,-tile*.42);ctx.stroke();ctx.restore();
for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/30);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life--;}particles=particles.filter(p=>p.life>0);
requestAnimationFrame(draw);}
function burst(x,y,color){for(let i=0;i<9;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:-Math.random()*3,size:2+Math.random()*3,life:25,color});}
function mine(x,y){if(Math.abs(x-player.x)+Math.abs(y-player.y)!==1){toast('Mine a block next to you!');return;}if(save.bag.length>=save.capacity){toast('Bag full! Sell your ores first');return;}ensureRows();let b=grid[y][x];b.hp-=save.power;let r=area.getBoundingClientRect(),sx=(r.width-cols*tile)/2+x*tile+tile/2,sy=y*tile-camY+tile/2;burst(sx,sy,b.ore.color);
if(b.hp<=0){save.bag.push(b.ore.name);save.counts[b.ore.name]=(save.counts[b.ore.name]||0)+1;save.depth=Math.max(save.depth,y);player.x=x;player.y=y;grid[y][x]={ore:ores[0],hp:1,seed:Math.random()};ensureRows();let reward=b.ore.value;if(y>0)save.coins+=Math.max(0,Math.floor(reward*.12));if(b.ore!==ores[0])toast(b.ore.emoji+' '+b.ore.name+' collected!');}
updateUI();persist();}
function sell(){if(!save.bag.length){toast('Your bag is empty!');return;}let total=0;for(let n of save.bag){let o=ores.find(v=>v.name===n);total+=o?o.value:1;}save.coins+=total;let count=save.bag.length;save.bag=[];updateUI();persist();toast('Sold '+count+' ores for '+total+' coins!');}
function openModal(type){$('modal').classList.add('open');if(type==='upgrades'){ $('modalTitle').textContent='🛠️ Workshop';renderUpgrades();}else{$('modalTitle').textContent='🎒 Ore Collection';renderCollection();}}
function renderUpgrades(){let pCost=35*Math.pow(2,save.upgrades.power),cCost=50+save.upgrades.capacity*35;$('modalBody').innerHTML='';
const items=[{ico:'⛏️',name:'Stronger Pickaxe',desc:'Mine tougher rocks in fewer hits. Current power: '+save.power,cost:pCost,action:()=>{save.coins-=pCost;save.power++;save.upgrades.power++;}},{ico:'🎒',name:'Bigger Backpack',desc:'Carry 10 more ores. Current capacity: '+save.capacity,cost:cCost,action:()=>{save.coins-=cCost;save.capacity+=10;save.upgrades.capacity++;}}];
for(let it of items){let row=document.createElement('div');row.className='upgrade';row.innerHTML='<div class="ico">'+it.ico+'</div><div class="info"><b>'+it.name+'</b><small>'+it.desc+'</small></div><button class="buy">🪙 '+it.cost+'</button>';let btn=row.querySelector('button');btn.disabled=save.coins<it.cost;btn.onclick=()=>{it.action();persist();updateUI();renderUpgrades();toast('Upgrade purchased!');};$('modalBody').append(row);}}
function renderCollection(){let body=$('modalBody');body.innerHTML='<p style="color:#9db1c8;font-size:12px;margin-top:0">Discover every mineral hidden underground.</p>';let box=document.createElement('div');box.className='inventory';for(let o of ores){let n=save.counts[o.name]||0;let el=document.createElement('div');el.className='ore';el.innerHTML='<span>'+o.emoji+' '+(n?o.name:'???')+'</span><b>'+n+'</b>';if(!n)el.style.opacity='.48';box.append(el);}body.append(box);}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();let r=canvas.getBoundingClientRect(),x=Math.floor((e.clientX-r.left-(r.width-cols*tile)/2)/tile),y=Math.floor((e.clientY-r.top+camY)/tile);if(x>=0&&x<cols&&y>=0&&y<grid.length)mine(x,y);},{passive:false});
$('sellBtn').onclick=sell;$('upgradeBtn').onclick=()=>openModal('upgrades');$('bagBtn').onclick=()=>openModal('collection');$('close').onclick=()=>$('modal').classList.remove('open');$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal'))$('modal').classList.remove('open');});
document.addEventListener('touchmove',e=>{if(!$('modal').classList.contains('open'))e.preventDefault();},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault());
ensureRows();resize();window.addEventListener('resize',resize);updateUI();draw();
})();
</script></body></html>
