(()=>{'use strict';

function hole(){return courses[courseIndex].holes[holeIndex];}

function draw(){let w=scale.w,h=scale.h;if(!w||!h){requestAnimationFrame(draw);return;}anim+=.016;let q=world(),c=courses[courseIndex],hl=hole();ctx.clearRect(0,0,w,h);
let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#8bd8ef');sky.addColorStop(.58,'#d9f0c0');sky.addColorStop(1,'#4c9a58');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);

ctx.fillStyle='#ffffff66';for(let i=0;i<3;i++){let x=(i*177+anim*4)%(w+100)-50;ctx.beginPath();ctx.arc(x,h*.2,15,0,Math.PI*2);ctx.arc(x+17,h*.19,19,0,Math.PI*2);ctx.arc(x+34,h*.2,13,0,Math.PI*2);ctx.fill();}
ctx.fillStyle='#5caa68';ctx.beginPath();ctx.moveTo(0,h);for(let x=0;x<=w;x+=8)ctx.lineTo(x,groundAt(q.x+x/w*q.w));ctx.lineTo(w,h);ctx.closePath();ctx.fill();
ctx.strokeStyle='#b9e58b';ctx.lineWidth=7;ctx.beginPath();for(let x=0;x<=w;x+=6){let y=groundAt(q.x+x/w*q.w);if(!x)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();

if(pat==='wave'){ctx.strokeStyle='#b5fff0';ctx.lineWidth=2;for(let j=-1;j<=1;j++){ctx.beginPath();for(let x=-ball.r;x<=ball.r;x+=2){let y=j*5+Math.sin(x*.55+j)*2;if(x===-ball.r)ctx.moveTo(ball.x+x,ball.y+y);else ctx.lineTo(ball.x+x,ball.y+y);}ctx.stroke();}}
if(pat==='camo'){let patches=[[-4,-4,4],[4,-2,3],[-2,5,3],[5,5,2]];patches.forEach((p,i)=>{ctx.fillStyle=['#b8b477','#3c5a39','#71824b','#293f31'][i];ctx.beginPath();ctx.ellipse(ball.x+p[0],ball.y+p[1],p[2],p[2]*.65,i*.7,0,Math.PI*2);ctx.fill();});}
if(pat==='galaxy'){ctx.strokeStyle='#c5c7ff';ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(ball.x,ball.y,ball.r*.95,ball.r*.36,-.55,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';[[-4,-4],[4,-5],[5,3],[-3,5]].forEach(p=>{ctx.beginPath();ctx.arc(ball.x+p[0],ball.y+p[1],1,0,Math.PI*2);ctx.fill();});}
if(pat==='checker'){let s=4;for(let yy=-8;yy<8;yy+=s)for(let xx=-8;xx<8;xx+=s){if((Math.floor((xx+8)/s)+Math.floor((yy+8)/s))%2===0){ctx.fillStyle='#27303a';ctx.fillRect(ball.x+xx,ball.y+yy,s,s);}}}
if(pat==='sunset'){ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(-.7);['#ffe17b','#ff9450','#b64e83'].forEach((col,i)=>{ctx.fillStyle=col;ctx.fillRect(-ball.r*1.5,-ball.r+i*5,ball.r*3,3);});ctx.restore();}
if(pat==='circuit'){ctx.strokeStyle='#76ffe4';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(ball.x-7,ball.y-3);ctx.lineTo(ball.x-2,ball.y-3);ctx.lineTo(ball.x-2,ball.y+2);ctx.lineTo(ball.x+5,ball.y+2);ctx.moveTo(ball.x+2,ball.y-7);ctx.lineTo(ball.x+2,ball.y-3);ctx.stroke();ctx.fillStyle='#bafff2';ctx.beginPath();ctx.arc(ball.x+5,ball.y+2,1.5,0,Math.PI*2);ctx.fill();}
ctx.restore();
drawMiniMap();if(!completed)physics();requestAnimationFrame(draw);}
function drawMiniMap(){let w=mini.clientWidth,h=mini.clientHeight,d=Math.min(devicePixelRatio||1,2);if(mini.width!==Math.round(w*d)||mini.height!==Math.round(h*d)){mini.width=w*d;mini.height=h*d;}mctx.setTransform(d,0,0,d,0,0);mctx.clearRect(0,0,w,h);mctx.fillStyle='#12392e';mctx.fillRect(0,0,w,h);mctx.strokeStyle='#8acb79';mctx.lineWidth=5;mctx.beginPath();mctx.moveTo(8,h-13);mctx.quadraticCurveTo(w*.45,8,w-9,16);mctx.stroke();let q=world(),hl=hole(),bx=8+(ball.x-q.x)/q.w*(w-16),by=h-13+(ball.y-groundAt(ball.x))/Math.max(1,q.h)*10;mctx.fillStyle='#f4e7ad';mctx.beginPath();mctx.arc(w-9,16,3.5,0,Math.PI*2);mctx.fill();mctx.fillStyle='#fff';mctx.beginPath();mctx.arc(clamp(bx,5,w-5),clamp(by,5,h-5),3.5,0,Math.PI*2);mctx.fill();mctx.strokeStyle='#e9b75c';mctx.lineWidth=2;for(let a of hl.water){let x=8+a[0]*(w-16),ww=a[2]*(w-16);mctx.beginPath();mctx.moveTo(x,h-12);mctx.lineTo(x+ww,h-12);mctx.stroke();} }
function showFullPreview(){let modal=$('previewModal');modal.classList.add('open');$('previewTitle').textContent=courses[courseIndex].name+' — Full Course';let w=Math.max(320,Math.min(860,previewCanvas.clientWidth||700)),h=Math.max(260,Math.min(480,innerHeight*.62)),d=Math.min(devicePixelRatio||1,2);previewCanvas.width=w*d;previewCanvas.height=h*d;pctx.setTransform(d,0,0,d,0,0);pctx.clearRect(0,0,w,h);let bg=pctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#9bd8eb');bg.addColorStop(1,'#d8edba');pctx.fillStyle=bg;pctx.fillRect(0,0,w,h);let gap=9,laneH=(h-24-gap*8)/9;courses[courseIndex].holes.forEach((hl,i)=>{let y=12+i*(laneH+gap),left=15,right=w-15;pctx.fillStyle=i===holeIndex?'#2e8050':'#4e9c5a';pctx.fillRect(left,y,right-left,laneH);pctx.fillStyle='#c5e78d';pctx.fillRect(left,y+laneH*.72,right-left,laneH*.28);pctx.strokeStyle='#d8f0a2';pctx.lineWidth=2;pctx.beginPath();pctx.moveTo(left+hl.start[0]*(right-left),y+laneH*.72);pctx.lineTo(left+hl.cup[0]*(right-left),y+laneH*.72);pctx.stroke();for(let a of hl.sand){pctx.fillStyle='#e9d18b';pctx.beginPath();pctx.ellipse(left+(a[0]+a[2]/2)*(right-left),y+laneH*.74,a[2]*(right-left)/2,Math.max(2,laneH*.12),0,0,Math.PI*2);pctx.fill();}for(let a of hl.water){pctx.fillStyle='#27a7c5';pctx.fillRect(left+a[0]*(right-left),y+laneH*.7,a[2]*(right-left),laneH*.3);}for(let a of hl.walls){pctx.fillStyle='#95603a';pctx.fillRect(left+a[0]*(right-left),y+laneH*.28,Math.max(3,a[2]*(right-left)),laneH*.45);}pctx.fillStyle='#f7f7e8';pctx.beginPath();pctx.arc(left+hl.start[0]*(right-left),y+laneH*.67,Math.max(3,laneH*.11),0,Math.PI*2);pctx.fill();pctx.fillStyle='#17251d';pctx.beginPath();pctx.arc(left+hl.cup[0]*(right-left),y+laneH*.72,Math.max(3,laneH*.09),0,Math.PI*2);pctx.fill();pctx.fillStyle='#16372a';pctx.font='bold 11px system-ui';pctx.fillText('HOLE '+(i+1)+'  •  PAR '+hl.par, left+7,y+12);if(i===holeIndex){pctx.strokeStyle='#ffe38b';pctx.lineWidth=3;pctx.strokeRect(left,y,right-left,laneH);}});}
function movingBall(){return Math.hypot(ball.vx,ball.vy)>.18;}
function physics(){let q=world(),hl=hole();ball.x+=ball.vx;ball.y+=ball.vy;let speed=Math.hypot(ball.vx,ball.vy);ball.vy+=.22;let nx=(ball.x-q.x)/q.w;let friction=.992;
for(let a of hl.sand)if(nx>a[0]&&nx<a[0]+a[2])friction=.965;ball.vx*=friction;
if(ball.x<q.x+ball.r){ball.x=q.x+ball.r;ball.vx=Math.abs(ball.vx)*.65;}if(ball.x>q.x+q.w-ball.r){ball.x=q.x+q.w-ball.r;ball.vx=-Math.abs(ball.vx)*.65;}
let gy=groundAt(ball.x)-ball.r;if(ball.y>gy){ball.y=gy;if(Math.abs(ball.vy)>1.1)ball.vy=-Math.abs(ball.vy)*.28;else ball.vy=0;ball.vx*=.985;}
for(let a of hl.walls){let x=q.x+a[0]*q.w,ww=Math.max(12,a[2]*q.w),hh=Math.max(12,Math.min(q.h*.38,a[3]*q.h*.48)),y=groundAt(x)-hh;collideRect(x,y,ww,hh);}
for(let a of hl.obstacles){let r=a._rect;if(r)collideRect(r.x,r.y,r.w,r.h);}
for(let a of hl.water){if(nx>a[0]&&nx<a[0]+a[2]&&ball.y>=groundAt(ball.x)-ball.r-5){let p=coords(hl.start);ball.x=p[0];ball.y=p[1]-ball.r;ball.vx=ball.vy=0;notify('Splash! Back to the tee.');}}
let cup=coords(hl.cup),dist=Math.hypot(ball.x-cup[0],ball.y-(groundAt(cup[0])-ball.r));if(dist<ball.r*1.3&&speed<3.8){ball.x=cup[0];ball.y=groundAt(cup[0])-ball.r;ball.vx=ball.vy=0;finishHole();}}
function collideRect(x,y,w,h){let cx=clamp(ball.x,x,x+w),cy=clamp(ball.y,y,y+h),dx=ball.x-cx,dy=ball.y-cy,d=Math.hypot(dx,dy);if(d<ball.r){if(d===0){dx=1;d=1;}let nx=dx/d,ny=dy/d;ball.x+=nx*(ball.r-d);ball.y+=ny*(ball.r-d);let dot=ball.vx*nx+ball.vy*ny;if(dot<0){ball.vx-=1.65*dot*nx;ball.vy-=1.65*dot*ny;}}}
function finishHole(){completed=true;let score=strokes-hole().par;let key=courseIndex+'-'+holeIndex;if(save.best[key]===undefined||strokes<save.best[key])save.best[key]=strokes;if(holeIndex===8)save.unlocked=Math.max(save.unlocked,Math.min(courses.length-1,courseIndex+1));persist();notify(score<0?'Eagle-level golf! Hole completed!':score===0?'Par! Nice shot!':'Hole completed!');$('tip').textContent='HOLE COMPLETE — TAP NEXT HOLE';}
function shoot(){if(!aim||movingBall()||completed)return;let dx=ball.x-aim.x,dy=ball.y-aim.y,len=Math.hypot(dx,dy);if(len<8){aim=null;return;}let power=Math.min(13,len*.105);ball.vx=dx/len*power;ball.vy=Math.min(0,dy/len*power)-Math.min(5,power*.38);strokes++;updateHud();aim=null;}
function pointerDown(e){e.preventDefault();if(movingBall()||completed)return;let r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(Math.hypot(x-ball.x,y-ball.y)<ball.r*3.5){aim={x,y};canvas.setPointerCapture?.(e.pointerId);}}
function pointerMove(e){if(!aim)return;e.preventDefault();let r=canvas.getBoundingClientRect();aim.x=e.clientX-r.left;aim.y=e.clientY-r.top;let dx=ball.x-aim.x,dy=ball.y-aim.y,len=Math.hypot(dx,dy);if(len>140){aim.x=ball.x-dx/len*140;aim.y=ball.y-dy/len*140;}}
canvas.addEventListener('pointerdown',pointerDown,{passive:false});canvas.addEventListener('pointermove',pointerMove,{passive:false});canvas.addEventListener('pointerup',e=>{e.preventDefault();shoot();},{passive:false});canvas.addEventListener('pointercancel',()=>aim=null);
function openBallSkins(){let body=$('modalBody');$('modalTitle').textContent='🎨 Choose your ball';body.innerHTML='<div class="skinGrid"></div>';let grid=body.firstChild;ballSkins.forEach((s,i)=>{let b=document.createElement('button');b.className='skinChoice'+(Number(save.ballSkin||0)===i?' selected':'');b.innerHTML='<span class="skinPreview '+s.pattern+'"></span><span><b>'+s.name+'</b><small>'+s.desc+'</small></span>';b.onclick=()=>{save.ballSkin=i;persist();$('modal').classList.remove('open');notify(s.name+' equipped');};grid.append(b);});$('modal').classList.add('open');}
function openCourses(){$('modal').classList.add('open');$('modalTitle').textContent='🗺️ Choose a course';let body=$('modalBody');body.innerHTML='';courses.forEach((c,i)=>{let row=document.createElement('div');row.className='courseRow';let locked=i>save.unlocked;row.innerHTML='<div class="ci">'+(locked?'🔒':c.emoji)+'</div><div class="desc"><b>'+c.name+'</b><small>'+c.desc+'</small></div><button '+(locked?'disabled':'')+'>'+(locked?'LOCKED':'PLAY')+'</button>';row.querySelector('button').onclick=()=>{courseIndex=i;holeIndex=0;$('modal').classList.remove('open');$('tip').textContent='PULL BACK FROM THE BALL TO AIM';resetHole();};body.append(row);});}
$('ballStyle').onclick=openBallSkins;$('courses').onclick=()=>{$('homeScreen').classList.remove('hidden');buildHome();};$('preview').onclick=showFullPreview;$('previewClose').onclick=()=>$('previewModal').classList.remove('open');$('previewModal').addEventListener('pointerdown',e=>{if(e.target===$('previewModal'))$('previewModal').classList.remove('open');});$('reset').onclick=()=>{resetHole();notify('Hole restarted');};$('next').onclick=()=>{if(!completed){notify('Sink the ball first!');return;}if(holeIndex<8){holeIndex++;resetHole();$('tip').textContent='PULL BACK FROM THE BALL TO AIM';}else{notify('Course complete! Choose another course.');openCourses();}};$('close').onclick=()=>$('modal').classList.remove('open');$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal'))$('modal').classList.remove('open');});
document.addEventListener('touchmove',e=>{if(!$('modal').classList.contains('open'))e.preventDefault();},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault());
resize();resetHole();window.addEventListener('resize',()=>{resize();resetHole();});window.addEventListener('orientationchange',()=>setTimeout(()=>{resize();resetHole();},180));draw();
})();
</script></body></html>
