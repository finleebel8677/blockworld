<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#10182d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="HOOKED!">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg">
<title>HOOKED! — Stickman Swing</title>
<style>
:root{--bg:#10182d;--panel:#1b2945;--gold:#ffd166;--cyan:#5ee7f7;--pink:#ff668e;--white:#f6f7fb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}button{font:800 15px system-ui;border:0;border-radius:14px;padding:13px 18px;background:linear-gradient(135deg,#ffe08a,#ffb84d);color:#222;box-shadow:0 5px 0 #a96b2b;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 2px 0 #a96b2b}.screen{position:absolute;inset:0;display:none;overflow:auto;padding:24px 18px max(24px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0,#263c63 0,#10182d 68%)}.screen.show{display:flex;flex-direction:column;align-items:center}.logo{font-size:clamp(48px,13vw,82px);font-weight:1000;letter-spacing:-5px;line-height:1;color:var(--gold);text-shadow:0 6px 0 #a96b2b,0 12px 30px #0008;margin:8vh 0 8px}.sub{color:#b9c8df;font-weight:700;letter-spacing:3px;text-transform:uppercase}.hero{width:min(340px,90vw);height:160px;margin:24px auto;position:relative}.hero .rope{position:absolute;left:50%;top:0;width:3px;height:100px;background:#d6e4f0;transform:rotate(28deg);transform-origin:top}.hero .stick{position:absolute;left:52%;top:77px;width:55px;height:55px;border:5px solid var(--cyan);border-radius:50%;box-shadow:0 0 30px #5ee7f7;transform:rotate(-25deg)}.hero:before,.hero:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--gold);top:0;left:18%}.hero:after{left:82%;top:48px;background:var(--pink)}.menu-actions{display:grid;gap:14px;width:min(320px,90vw);margin-top:12px}.secondary{background:#273957;color:white;box-shadow:0 5px 0 #111d32;border:1px solid #405879}.smallnote{color:#9fb1cb;font-size:12px;text-align:center;margin-top:auto;padding-top:28px}.topline{width:min(600px,100%);display:flex;justify-content:space-between;align-items:center;color:#c6d4e9;font-weight:800}.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:min(520px,100%);margin-top:24px}.level{background:#253653;color:white;box-shadow:0 4px 0 #111d32;border:1px solid #405879;padding:15px 4px}.level.locked{opacity:.35;filter:grayscale(1)}.level.done{border-color:var(--gold);color:var(--gold)}.skinrow{display:flex;gap:12px;align-items:center;background:#243653;border-radius:16px;padding:12px;width:min(440px,100%);margin:7px}.skinpreview{width:48px;height:48px;border-radius:50%;border:5px solid var(--cyan);background:#10182d}.skinrow div:nth-child(2){flex:1}.skinrow small{display:block;color:#aebdd2}.game{position:absolute;inset:0;display:none;background:#17243c}.game.show{display:block}canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.hudbox{background:#10182dcc;border:1px solid #ffffff26;border-radius:12px;padding:8px 12px;font-weight:900;text-shadow:0 2px #000}.hud button{pointer-events:auto;padding:9px 12px;font-size:12px}.hint{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#e8f2ff;font-size:13px;font-weight:800;text-shadow:0 2px 4px #000;pointer-events:none}.toast{position:absolute;top:20%;left:0;right:0;text-align:center;font-size:26px;font-weight:1000;color:var(--gold);text-shadow:0 3px 8px #000;pointer-events:none;opacity:0;transition:opacity .2s}.toast.on{opacity:1}.modal{position:absolute;inset:0;background:#07101ddd;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalcard{background:#1b2945;border:1px solid #526989;border-radius:22px;padding:26px;text-align:center;width:min(340px,100%)}.modalcard h2{font-size:32px;margin:4px}.modalcard p{color:#c2d0e3}.modalcard button{width:100%;margin-top:10px}
</style></head><body>
<section id="home" class="screen show"><div class="logo">HOOKED!</div><div class="sub">Swing • Fly • Survive</div><div class="hero"><div class="rope"></div><div class="stick"></div></div><div style="font-size:16px;color:#d7e3f3;text-align:center;max-width:310px">A tiny stickman. A giant world. One rope between you and the finish.</div><div class="menu-actions"><button id="play">PLAY</button><button id="levelbtn" class="secondary">LEVEL SELECT</button><button id="skinsbtn" class="secondary">STICKMAN SKINS</button></div><div class="smallnote">Hold to hook • Release to launch<br>Made for touch screens</div></section>
<section id="levels" class="screen"><div class="topline"><button class="secondary" id="back1">← BACK</button><span>CHOOSE A LEVEL</span><span id="progress">0 / 12</span></div><div class="levels" id="levelgrid"></div></section>
<section id="skins" class="screen"><div class="topline"><button class="secondary" id="back2">← BACK</button><span>YOUR STICKMAN</span><span id="coins">0 🪙</span></div><div id="skinlist" style="width:100%;display:flex;flex-direction:column;align-items:center;margin-top:25px"></div></section>
<div id="game" class="game"><canvas id="cv"></canvas><div class="hud"><div class="hudbox"><span id="levellabel">LEVEL 1</span><br><span id="coinlabel">🪙 0</span></div><div style="display:flex;gap:8px"><div class="hudbox" id="timer">0.0s</div><button class="secondary" id="pause">Ⅱ</button></div></div><div class="toast" id="toast">NICE!</div><div class="hint" id="hint">HOLD ANYWHERE TO HOOK • RELEASE TO FLY</div></div>
<div class="modal" id="modal"><div class="modalcard"><h2 id="modaltitle">LEVEL COMPLETE!</h2><p id="modaltext">You made it!</p><button id="next">NEXT LEVEL</button><button class="secondary" id="retry">RETRY</button><button class="secondary" id="menubtn">MAIN MENU</button></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
const saveKey='hookedProgressV1';let saved={unlocked:1,coins:0,skin:0,owned:[0],best:{}};try{saved={...saved,...JSON.parse(localStorage.getItem(saveKey)||'{}')}}catch(e){} 
const skins=[{name:'Classic',cost:0,color:'#5ee7f7'},{name:'Hotshot',cost:60,color:'#ff668e'},{name:'Gold Rush',cost:140,color:'#ffd166'},{name:'Frostbite',cost:240,color:'#a9d9ff'},{name:'Violet Viper',cost:380,color:'#bd91ff'},{name:'Lime Pop',cost:550,color:'#a6ed78'}];
const save=()=>{try{localStorage.setItem(saveKey,JSON.stringify(saved))}catch(e){}};
let W=innerWidth,H=innerHeight,dpr=1,active=false,paused=false,level=1,world=0,elapsed=0,coinsRun=0,hook=null,holding=false,player,anchors=[],hazards=[],platforms=[],goal,particles=[],cam=0,raf=0,last=0,won=false;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('show'));$('game').classList.remove('show');$(id).classList.add('show')}
function refresh(){ $('progress').textContent=(saved.unlocked-1)+' / 12';$('coins').textContent=saved.coins+' 🪙';$('levelgrid').innerHTML='';for(let i=1;i<=12;i++){let b=document.createElement('button');b.className='level'+(i>saved.unlocked?' locked':'')+(saved.best[i]?' done':'');b.textContent=(i>saved.unlocked?'🔒 ': '')+i+(saved.best[i]?' ★':'');b.disabled=i>saved.unlocked;b.onclick=()=>start(i);$('levelgrid').append(b)}$('skinlist').innerHTML='';skins.forEach((s,i)=>{let row=document.createElement('div');row.className='skinrow';let p=document.createElement('div');p.className='skinpreview';p.style.borderColor=s.color;let info=document.createElement('div');info.innerHTML='<b>'+s.name+'</b><small>'+(saved.owned.includes(i)?'Unlocked':s.cost+' coins')+'</small>';let b=document.createElement('button');b.className=saved.skin===i?'secondary':'';b.textContent=saved.skin===i?'EQUIPPED':saved.owned.includes(i)?'EQUIP':'BUY';b.onclick=()=>{if(saved.owned.includes(i))saved.skin=i;else if(saved.coins>=s.cost){saved.coins-=s.cost;saved.owned.push(i);saved.skin=i}else{toast('NEED MORE COINS');return}save();refresh()};row.append(p,info,b);$('skinlist').append(row)})}
function makeLevel(n){let length=2400+n*260,spacing=270-Math.min(n*5,80);anchors=[];hazards=[];platforms=[];let count=Math.ceil(length/spacing);for(let i=0;i<count;i++){let x=170+i*spacing+((i%2)*45),y=100+((i*137+n*53)%Math.max(150,H*.42));anchors.push({x,y,r:13});if(i>1&&i%3===1)hazards.push({x:x+spacing*.38,y:y+180+(i%2)*55,w:55,h:22,type:'spike'});if(i>0&&i%4===0)platforms.push({x:x-65,y:y+235,w:140,h:18})}goal={x:length-100,y:H*.55};world=length}
function start(n){level=n;show('game');$('game').classList.add('show');$('modal').classList.remove('show');$('levellabel').textContent='LEVEL '+n;makeLevel(n);elapsed=0;coinsRun=0;won=false;paused=false;cam=0;hook=null;holding=false;particles=[];player={x:70,y:H*.48,vx:120,vy:0,r:13,angle:0};$('hint').textContent='HOLD ANYWHERE TO HOOK • RELEASE TO FLY';active=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function nearest(){let best=null,bd=280;for(const a of anchors){let d=Math.hypot(a.x-player.x,a.y-player.y);if(d<bd&&a.x>cam-100){best=a;bd=d}}return best}
function attach(){if(!active||paused||won)return;let a=nearest();if(a){hook=a;holding=true;let dx=player.x-a.x,dy=player.y-a.y;hook.len=Math.max(60,Math.hypot(dx,dy));$('hint').textContent='ROPE ATTACHED — RELEASE TO LAUNCH!';}}
function release(){holding=false;hook=null;if(active)$('hint').textContent='HOLD ANYWHERE TO HOOK • RELEASE TO FLY'}
function pointerDown(e){e.preventDefault();if(e.target.closest('button'))return;attach()}function pointerUp(e){release()}$('game').addEventListener('pointerdown',pointerDown);$('game').addEventListener('pointerup',pointerUp);$('game').addEventListener('pointercancel',pointerUp);
function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),850)}
function burst(x,y,color,count=12){for(let i=0;i<count;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*170;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.55,color})}}
function win(){if(won)return;won=true;active=false;release();saved.coins+=coinsRun+25;saved.unlocked=Math.max(saved.unlocked,Math.min(13,level+1));saved.best[level]=true;save();refresh();$('modaltitle').textContent='LEVEL COMPLETE!';$('modaltext').textContent='+'+(coinsRun+25)+' coins • Time: '+elapsed.toFixed(1)+'s';$('next').style.display=level<12?'block':'none';$('next').textContent='NEXT LEVEL';$('modal').classList.add('show')}
function lose(){if(!active)return;active=false;release();$('modaltitle').textContent='TRY AGAIN!';$('modaltext').textContent='You hit an obstacle. Give it another shot.';$('next').style.display='none';$('modal').classList.add('show')}
function loop(now){if(!active)return;let dt=Math.min((now-last)/1000,.033);last=now;if(!paused){elapsed+=dt;step(dt)}draw();raf=requestAnimationFrame(loop)}
function step(dt){let p=player;let g=980;p.vy+=g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
if(hook&&holding){let dx=p.x-hook.x,dy=p.y-hook.y,d=Math.hypot(dx,dy)||1,ex=hook.x+dx/d*hook.len,ey=hook.y+dy/d*hook.len,err=d-hook.len;p.x-=dx/d*err;p.y-=dy/d*err;let radial=(p.vx*dx+p.vy*dy)/d;p.vx-=dx/d*radial;p.vy-=dy/d*radial}
p.vx=Math.max(-560,Math.min(650,p.vx));p.angle=Math.atan2(p.vy,p.vx);cam=Math.max(0,p.x-W*.32);
for(const h of hazards){if(p.x+p.r>h.x&&p.x-p.r<h.x+h.w&&p.y+p.r>h.y-8&&p.y-p.r<h.y+h.h)lose()}
for(const pl of platforms){if(p.x+p.r>pl.x&&p.x-p.r<pl.x+pl.w&&p.y+p.r>pl.y&&p.y-p.r<pl.y+pl.h&&p.vy>0){p.y=pl.y-p.r;p.vy=-Math.abs(p.vy)*.55}}
if(p.y>H+100||p.y< -180||p.x>world+150)lose();
if(Math.floor(p.x/410)>Math.floor((p.x-p.vx*dt)/410)){coinsRun+=1;burst(p.x,p.y,'#ffd166',7);$('coinlabel').textContent='🪙 '+coinsRun}
if(p.x>=goal.x-35)win();
particles=particles.filter(q=>q.life>0);for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;q.vy+=300*dt}
$('timer').textContent=elapsed.toFixed(1)+'s'}
function draw(){ctx.clearRect(0,0,W,H);let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#243d63');grad.addColorStop(1,'#111a30');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(-cam,0);
for(let i=0;i<80;i++){let x=(i*173)%world,y=(i*97)%H;ctx.fillStyle='#ffffff16';ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill()}
ctx.fillStyle='#172c3d';ctx.fillRect(0,H-25,world,25);
for(const a of anchors){ctx.strokeStyle='#91a8c7';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x,a.y+34);ctx.stroke();ctx.fillStyle='#ffd166';ctx.shadowColor='#ffd166';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(a.x,a.y,9,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff2b8';ctx.lineWidth=2;ctx.stroke()}
for(const pl of platforms){ctx.fillStyle='#5b7694';ctx.fillRect(pl.x,pl.y,pl.w,pl.h);ctx.fillStyle='#91aecb';ctx.fillRect(pl.x,pl.y,pl.w,4)}
for(const h of hazards){ctx.fillStyle='#ff5477';ctx.beginPath();ctx.moveTo(h.x,h.y+h.h);ctx.lineTo(h.x+h.w/2,h.y-9);ctx.lineTo(h.x+h.w,h.y+h.h);ctx.closePath();ctx.fill();ctx.strokeStyle='#ffb1c2';ctx.stroke()}
ctx.fillStyle='#5ee7f7';ctx.shadowColor='#5ee7f7';ctx.shadowBlur=22;ctx.beginPath();ctx.arc(goal.x,goal.y,25,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(goal.x,goal.y,17,0,7);ctx.stroke();
for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/.55);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,3,0,7);ctx.fill()}ctx.globalAlpha=1;
if(hook){ctx.strokeStyle='#f4f7ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(hook.x,hook.y);ctx.stroke();ctx.strokeStyle='#5ee7f7';ctx.lineWidth=1;ctx.stroke()}
const color=skins[saved.skin].color;ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.angle*.25);ctx.strokeStyle=color;ctx.lineWidth=5;ctx.lineCap='round';ctx.shadowColor=color;ctx.shadowBlur=13;ctx.beginPath();ctx.arc(0,-15,9,0,7);ctx.moveTo(0,-6);ctx.lineTo(0,15);ctx.moveTo(0,0);ctx.lineTo(-12,9);ctx.moveTo(0,0);ctx.lineTo(13,6);ctx.moveTo(0,15);ctx.lineTo(-10,28);ctx.moveTo(0,15);ctx.lineTo(11,27);ctx.stroke();ctx.restore();ctx.restore();
}
$('play').onclick=()=>start(Math.min(saved.unlocked,12));$('levelbtn').onclick=()=>{refresh();show('levels')};$('skinsbtn').onclick=()=>{refresh();show('skins')};$('back1').onclick=()=>show('home');$('back2').onclick=()=>show('home');$('pause').onclick=()=>{if(!active)return;paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';$('hint').textContent=paused?'PAUSED':'HOLD ANYWHERE TO HOOK • RELEASE TO FLY'};$('retry').onclick=()=>start(level);$('next').onclick=()=>start(Math.min(12,level+1));$('menubtn').onclick=()=>{$('modal').classList.remove('show');active=false;show('home')};
addEventListener('keydown',e=>{if(e.code==='Space'){if(!e.repeat)attach()} });addEventListener('keyup',e=>{if(e.code==='Space')release()});
refresh();
})();
</script></body></html>
